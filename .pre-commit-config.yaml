# Hooks de pré-commit executados pelo prek (https://prek.j178.dev).
#
# O arquivo mantém o formato do pre-commit upstream, então também funciona com
# `pre-commit`. Para instalar os shims do Git:
#
#   prek install
#
# Para rodar manualmente em todos os arquivos:
#
#   prek run --all-files
default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        description: Formata os arquivos com Prettier.
        language: system
        entry: pnpm exec prettier --write --ignore-unknown
        files: '\.(ts|css|json|ya?ml)$'
        exclude: '^pnpm-lock\.yaml$'
      - id: eslint
        name: eslint
        description: Analisa o TypeScript com ESLint.
        language: system
        entry: pnpm exec eslint --max-warnings=0 --fix
        types: [ts]
      - id: typecheck
        name: typecheck
        description: Checa os tipos com tsc --noEmit.
        language: system
        entry: pnpm exec tsc --noEmit
        pass_filenames: false
        files: '\.ts$'
